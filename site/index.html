<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>MIDI Rhythm</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="cv"></canvas>

<main id="menu">
  <h1>MIDI Rhythm</h1>
  <p class="lead">MIDIファイルを選ぶと、譜面を自動で作ります。</p>
  <label class="file">MIDIファイルを選択<input id="midi" type="file" accept=".mid,.midi,audio/midi,audio/x-midi"></label>
  <p id="fname" class="fname">未選択</p>
  <label class="file sub" id="sfRow" hidden>SoundFontを選択<input id="sf" type="file" accept=".sf2,.sf3"></label>
  <div class="opts">
    <label>レーン数
      <select id="lanes"><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select>
    </label>
    <label>ノーツ速度 <b id="speedV"></b>
      <input id="speed" type="range" min="0.8" max="3" step="0.1">
    </label>
    <label>判定オフセット <b id="offsetV"></b>
      <input id="offset" type="range" min="-300" max="300" step="10">
    </label>
  </div>
  <button id="start" disabled>開始</button>
  <p id="status" class="status">音源を読み込み中…</p>
</main>

<section id="result" hidden>
  <p class="rlabel">SCORE</p>
  <p id="rScore" class="rscore"></p>
  <p id="rDetail" class="rdetail"></p>
  <button id="again">メニューに戻る</button>
</section>

<script type="module" src="js/main.js"></script>
</body>
</html>
